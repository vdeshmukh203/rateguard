[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rateguard"
version = "0.1.0"
description = "Local rate limiter for LLM API calls"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vaibhav Deshmukh"}]
keywords = ["rate-limit", "token-bucket", "sliding-window", "llm", "api", "throttle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
]

[project.urls]
"Homepage"    = "https://github.com/vdeshmukh203/rateguard"
"Source"      = "https://github.com/vdeshmukh203/rateguard"
"Bug Tracker" = "https://github.com/vdeshmukh203/rateguard/issues"
"Documentation" = "https://github.com/vdeshmukh203/rateguard#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.scripts]
rateguard-gui = "rateguard._gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short"

[tool.mypy]
python_version        = "3.9"
strict                = true
ignore_missing_imports = true

[tool.coverage.run]
omit = ["src/rateguard/_gui.py"]

[tool.ruff]
line-length    = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
