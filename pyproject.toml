[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rateguard"
version = "0.2.0"
description = "Local rate limiter for LLM API calls"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vaibhav Deshmukh"}]
keywords = ["python", "rate-limit", "token-bucket", "sliding-window", "llm", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]

[project.urls]
"Homepage" = "https://github.com/vdeshmukh203/rateguard"
"Source" = "https://github.com/vdeshmukh203/rateguard"
"Bug Tracker" = "https://github.com/vdeshmukh203/rateguard/issues"

[project.scripts]
rateguard-gui = "rateguard._gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
